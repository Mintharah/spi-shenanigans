; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = genericSTM32F401CC

[env:genericSTM32F401CC]
platform = ststm32
board = genericSTM32F401CC
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_type = debug
monitor_speed = 115200

board_build.hex = true
board_build.f_cpu = 84000000L
extra_scripts = 
  post:convert_hex.py

build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F401xC
    -Iinclude
    -Iinclude/hardware/adc
    -Iinclude/hardware/uart
    -Iinclude/hardware/spi
    -Iinclude/hardware/gpio
    -Iinclude/hardware/
    -Iinclude/hardware/i2c
    -Iinclude/sensors/current
    -Iinclude/sensors/hall
    -Iinclude/sensors/imu
    -Iinclude/sensors/temperature

    -Iinclude/sensors/imu/interface
    -Iinclude/sensors/imu/src
    -Iinclude/sensors/imu/example
    -Wl,-u,_printf_float
    